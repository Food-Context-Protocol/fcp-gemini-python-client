[project]
name = "gemini-connector"
version = "0.1.0"
description = "Standalone Gemini 3 Python client with multimodal, grounding, thinking, and Live API support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Food Context Protocol Contributors"}
]
keywords = ["gemini", "google", "ai", "multimodal", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fcp-gemini-core @ git+https://github.com/Food-Context-Protocol/fcp-gemini-core.git@v1.0.1",
    "google-generativeai>=0.8.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/Food-Context-Protocol/gemini-connector"
Documentation = "https://fcp.dev/docs"
Repository = "https://github.com/Food-Context-Protocol/gemini-connector"
"Bug Tracker" = "https://github.com/Food-Context-Protocol/gemini-connector/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_connector"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ty]
# ty type checker configuration

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unused-ignore-comment = "ignore"
unresolved-import = "ignore"
missing-argument = "ignore"
unknown-argument = "ignore"
possibly-missing-attribute = "ignore"
not-iterable = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "8.0"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/gemini_connector"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
